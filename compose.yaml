services:
  abfall-ooe:
    build: .
    image: abfall-ooe:local
    container_name: abfall-ooe
    restart: unless-stopped
    ports:
      - "${LOXONE_BRIDGE_PORT:-8765}:8765"
    environment:
      LOXONE_BRIDGE_API_KEY: ${LOXONE_BRIDGE_API_KEY:-}
      TZ: Europe/Vienna
    volumes:
      - bridge-data:/app/bridge/data
      - address-data:/app/tools/helpers/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bridge-data:
  address-data:
