name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r bridge/requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check Linux installer syntax
        if: runner.os == 'Linux'
        run: |
          bash -n bridge/install_loxone_bridge.sh
          bash -n bridge/uninstall_loxone_bridge.sh
      - name: Check setup behavior and generated XML
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: node tests/setup-check.cjs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r bridge/requirements.txt --strict
      - name: Scan source and all available history (redacted)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 dir /repo --redact --no-banner
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --no-banner --log-opts="--all"
